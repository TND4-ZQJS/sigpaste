<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signature Extraction Tool</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #preview { margin-top: 20px; }
    img { max-width: 100%; }
    button { margin-top: 10px; }
    .slider { width: 200px; }
  </style>
</head>
<body>
  <h2>Signature Extraction (Dark strokes only)</h2>

  <!-- Step 1: Upload -->
  <input type="file" id="upload" accept="image/*"><br><br>
  <div>
    <img id="image" style="max-width:500px; display:none;">
  </div>
  
  <!-- Threshold slider -->
  <label>
    Signature threshold:
    <input type="range" id="threshold" min="0" max="255" value="200" class="slider">
    <span id="thresholdValue">200</span>
  </label>
  <br>

  <button id="cropBtn" style="display:none;">Extract Signature</button>
  <button id="downloadBtn" style="display:none;">Download PNG</button>

  <!-- Step 3: Result -->
  <div id="preview">
    <h3>Extracted Signature:</h3>
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    let cropper;
    let croppedCanvas;

    const thresholdInput = document.getElementById("threshold");
    const thresholdValue = document.getElementById("thresholdValue");
    thresholdInput.addEventListener("input", () => {
      thresholdValue.textContent = thresholdInput.value;
      if (croppedCanvas) applySignatureExtraction();
    });

    // Step 1: Upload
    document.getElementById("upload").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = document.getElementById("image");
        img.src = event.target.result;
        img.style.display = "block";

        if (cropper) cropper.destroy(); 
        cropper = new Cropper(img, { aspectRatio: NaN });
        document.getElementById("cropBtn").style.display = "inline-block";
      };
      reader.readAsDataURL(file);
    });

    // Step 2: Crop
    document.getElementById("cropBtn").addEventListener("click", function () {
      if (!cropper) return;
      croppedCanvas = cropper.getCroppedCanvas();
      applySignatureExtraction();
      document.getElementById("downloadBtn").style.display = "inline-block";
    });

    // Signature extraction (dark strokes only)
    function applySignatureExtraction() {
      if (!croppedCanvas) return;
      const threshold = parseInt(thresholdInput.value, 10);

      const ctx = croppedCanvas.getContext("2d");
      const imgData = ctx.getImageData(0, 0, croppedCanvas.width, croppedCanvas.height);

      for (let i = 0; i < imgData.data.length; i += 4) {
        const r = imgData.data[i];
        const g = imgData.data[i + 1];
        const b = imgData.data[i + 2];

        // brightness (0=black, 255=white)
        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;

        if (brightness > threshold) {
          imgData.data[i + 3] = 0; // transparent background
        } else {
          // keep strokes, force them to dark color
          imgData.data[i] = 0;
          imgData.data[i+1] = 0;
          imgData.data[i+2] = 0;
        }
      }

      ctx.putImageData(imgData, 0, 0);

      // Show result in preview canvas
      const resultCanvas = document.getElementById("canvas");
      resultCanvas.width = croppedCanvas.width;
      resultCanvas.height = croppedCanvas.height;
      resultCanvas.getContext("2d").drawImage(croppedCanvas, 0, 0);
    }

    // Step 3: Download PNG
    document.getElementById("downloadBtn").addEventListener("click", function () {
      const resultCanvas = document.getElementById("canvas");
      const link = document.createElement("a");
      link.download = "signature.png";
      link.href = resultCanvas.toDataURL("image/png");
      link.click();
    });
  </script>
</body>
</html>
