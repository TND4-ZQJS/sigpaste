<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Signature Extraction Tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --accent:#007aff;
    --muted:#666; --line:#e9e9ee;
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
       margin:18px;background:var(--bg);color:#111}
  main{max-width:980px;margin:0 auto;background:var(--card);padding:18px;
       border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,0.06)}
  h1{margin:15px 0 25px 0;font-size:1.5rem}
  .section{background:#fbfbfd;border:1px solid #eee;padding:14px;
           border-radius:10px;margin:12px 0}
  .section h2{margin:0 0 10px 0;font-size:1.05rem}
  input[type=file]{margin:10px 0}
  canvas{max-width:100%;border:1px solid #ccc;border-radius:6px}
  .actions{margin-top:12px;display:flex;gap:10px}
  button{background:var(--accent);color:#fff;border:0;padding:10px 14px;
         border-radius:10px;cursor:pointer}
  button.secondary{background:#999}
  .step-indicator{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .pill{padding:6px 12px;border-radius:20px;background:#eee;font-size:0.9rem;cursor:pointer}
  .pill.active{background:var(--accent);color:#fff}
  .hidden{display:none}

  /* Step 4 draggable signature box */
  #sigBox {
    position:absolute;
    top:30px; left:30px;
    border:2px dashed #007aff;
    padding:6px 10px;
    border-radius:6px;
    background:rgba(255,255,255,0.7);
    cursor:move;
    user-select:none;
  }
</style>
</head>
<body>
<main>
  <h1>Signature Extraction Tool</h1>

  <!-- Step pills -->
  <div class="step-indicator">
    <span class="pill" id="pi1">1. Upload</span>
    <span class="pill" id="pi2">2. Crop</span>
    <span class="pill" id="pi3">3. Extract</span>
    <span class="pill" id="pi4">4. Place in PDF</span>
  </div>

  <!-- Step 1 -->
  <div class="section" id="step1">
    <h2>Step 1 — Upload Image</h2>
    <input type="file" id="fileInput" accept="image/*">
    <div class="actions">
      <button id="s1Next" disabled>Next</button>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="section hidden" id="step2">
    <h2>Step 2 — Crop Image</h2>
    <canvas id="cropCanvas"></canvas>
    <div class="actions">
      <button class="secondary" id="s2Back">Back</button>
      <button id="s2Next">Next</button>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="section hidden" id="step3">
    <h2>Step 3 — Extract Signature</h2>
    <canvas id="extractCanvas"></canvas>
    <div class="actions">
      <button class="secondary" id="s3Back">Back</button>
      <button id="s3Next">Next: Place in PDF</button>
    </div>
  </div>

  <!-- Step 4 -->
  <div class="section hidden" id="step4">
    <h2>Step 4 — Place Signature in PDF</h2>
    <input type="file" id="pdfUpload" accept="application/pdf" />
    <div style="position:relative;display:inline-block;">
      <canvas id="pdfCanvas" style="border:1px solid #ccc;max-width:100%;"></canvas>
      <div id="sigBox" class="hidden">✍️ Signature</div>
    </div>
    <div class="actions">
      <button class="secondary" id="s4Back">Back</button>
      <button id="s4Done">Generate PDF</button>
    </div>
  </div>
</main>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
const stepEls=[step1,step2,step3,step4];
const pills=[pi1,pi2,pi3,pi4];
function go(step){
  stepEls.forEach((el,i)=>el.classList.toggle('hidden',i!==step-1));
  pills.forEach((p,i)=>p.classList.toggle('active',i===step-1));
}
pills.forEach((pill,i)=>pill.addEventListener('click',()=>go(i+1)));

// Step 1
let uploadedImg=null;
fileInput.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(file){
    const r=new FileReader();
    r.onload=()=>{uploadedImg=new Image();uploadedImg.onload=()=>{
      const ctx=cropCanvas.getContext('2d');
      cropCanvas.width=uploadedImg.width;
      cropCanvas.height=uploadedImg.height;
      ctx.drawImage(uploadedImg,0,0);
      s1Next.disabled=false;
    };uploadedImg.src=r.result;};
    r.readAsDataURL(file);
  }
});
s1Next.addEventListener('click',()=>go(2));

// Step 2
s2Back.addEventListener('click',()=>go(1));
s2Next.addEventListener('click',()=>{
  const ctx=extractCanvas.getContext('2d');
  extractCanvas.width=cropCanvas.width;
  extractCanvas.height=cropCanvas.height;
  ctx.drawImage(cropCanvas,0,0);
  go(3);
});

// Step 3
s3Back.addEventListener('click',()=>go(2));
s3Next.addEventListener('click',()=>go(4));

// Step 4
s4Back.addEventListener('click',()=>go(3));

// draggable signature box
let isDragging=false, offsetX=0, offsetY=0;
sigBox.addEventListener('mousedown',e=>{
  isDragging=true;
  offsetX=e.offsetX; offsetY=e.offsetY;
});
document.addEventListener('mousemove',e=>{
  if(isDragging){
    sigBox.style.left=(e.pageX-pdfCanvas.offsetLeft-offsetX)+"px";
    sigBox.style.top=(e.pageY-pdfCanvas.offsetTop-offsetY)+"px";
  }
});
document.addEventListener('mouseup',()=>isDragging=false);

// load PDF first page
pdfUpload.addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    const pdfData=new Uint8Array(reader.result);
    const pdf=await pdfjsLib.getDocument({data:pdfData}).promise;
    const page=await pdf.getPage(1);
    const viewport=page.getViewport({scale:1.5});
    pdfCanvas.width=viewport.width;
    pdfCanvas.height=viewport.height;
    const ctx=pdfCanvas.getContext('2d');
    await page.render({canvasContext:ctx,viewport}).promise;
    sigBox.classList.remove('hidden'); // show signature box
  };
  reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
