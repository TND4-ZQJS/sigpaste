<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Signature Wizard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 0;
    }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    .step { display: none; background: #fff; padding: 20px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .step.active { display: block; }
    .actions { text-align: center; margin-top: 20px; }
    .actions button { padding: 10px 20px; border-radius: 8px; border: none;
                      margin: 0 10px; font-weight: 600; cursor: pointer; }
    .primary { background: #0071e3; color: #fff; }
    .ghost { background: #e0e0e0; color: #333; }
    #cropArea img { max-width: 100%; }
    #pdfWrap { position: relative; display: inline-block; }
    #pdfCanvas { border: 1px solid #ccc; display: block; }
    #sigImg { position: absolute; top: 20px; left: 20px; cursor: move;
              border: 2px dashed #0071e3; resize: both; overflow: auto; }
  </style>
  <!-- External libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Step 1 -->
    <div class="step active" id="step1">
      <h2>Step 1: Upload PDF</h2>
      <input type="file" id="pdfUpload" accept="application/pdf" />
      <div class="actions">
        <button class="primary" onclick="go(2)">Next</button>
      </div>
    </div>

    <!-- Step 2 -->
    <div class="step" id="step2">
      <h2>Step 2: Upload & Crop Signature</h2>
      <input type="file" id="sigUpload" accept="image/*" />
      <div id="cropArea"></div>
      <div class="actions">
        <button class="ghost" onclick="go(1)">Back</button>
        <button class="primary" onclick="cropSig()">Next</button>
      </div>
    </div>

    <!-- Step 3 -->
    <div class="step" id="step3">
      <h2>Step 3: Preview Signature</h2>
      <img id="sigPreview" alt="Cropped Signature" style="max-width:200px; border:1px solid #ccc;" />
      <div class="actions">
        <button class="ghost" onclick="go(2)">Back</button>
        <button class="primary" onclick="go(4)">Next</button>
      </div>
    </div>

    <!-- Step 4 -->
    <div class="step" id="step4">
      <h2>Step 4: Place Signature on PDF</h2>
      <div id="pdfWrap">
        <canvas id="pdfCanvas"></canvas>
        <img id="sigImg" style="display:none; width:120px;" />
      </div>
      <div class="actions">
        <button class="ghost" onclick="go(3)">Back</button>
        <button class="primary" id="s4Soon" disabled>Save PDF</button>
      </div>
    </div>
  </div>

  <script>
    /* ---------- Helpers ---------- */
    function $(id){ return document.getElementById(id); }
    function go(step){
      document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
      $("step"+step).classList.add("active");
    }

    /* ---------- Step 2: Crop Signature ---------- */
    let cropper;
    $("sigUpload").addEventListener("change", e=>{
      const file = e.target.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = ()=>{
          $("cropArea").innerHTML = `<img id="cropImg" src="${reader.result}">`;
          cropper = new Cropper($("cropImg"), { aspectRatio: NaN });
        };
        reader.readAsDataURL(file);
      }
    });
    function cropSig(){
      if(cropper){
        const canvas = cropper.getCroppedCanvas();
        $("sigPreview").src = canvas.toDataURL("image/png");
        $("sigImg").src = canvas.toDataURL("image/png");
        $("sigImg").style.display = "block";
        go(3);
      }
    }

    /* ---------- Step 4: PDF Multi-page & Export ---------- */
    const pdfCanvas = $("pdfCanvas");
    const pdfCtx = pdfCanvas.getContext("2d");
    let pdfDoc = null, currentPage=1, totalPages=0;
    const sigImg = $("sigImg"), wrap = $("pdfWrap");
    const sigPositions = {};

    // Add navigation UI
    const nav = document.createElement("div");
    nav.className = "actions";
    nav.innerHTML = `
      <button id="prevPage" class="ghost">Prev</button>
      <span id="pageInfo" style="flex:1; text-align:center"></span>
      <button id="nextPage" class="ghost">Next</button>
    `;
    $("step4").insertBefore(nav, wrap);

    async function renderPage(num){
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });
      pdfCanvas.width = viewport.width;
      pdfCanvas.height = viewport.height;
      await page.render({ canvasContext: pdfCtx, viewport }).promise;

      if(sigPositions[num]){
        const pos = sigPositions[num];
        sigImg.src = pos.dataUrl;
        sigImg.style.width = pos.w+"px";
        sigImg.style.left = pos.x+"px";
        sigImg.style.top = pos.y+"px";
        sigImg.style.display = "block";
      } else {
        sigImg.style.display = "none";
      }
      $("pageInfo").textContent = `Page ${num} / ${totalPages}`;
    }

    // Load PDF
    $("pdfUpload").addEventListener("change", async (e)=>{
      const file = e.target.files?.[0]; if(!file) return;
      const buf = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      totalPages = pdfDoc.numPages;
      currentPage = 1;
      renderPage(currentPage);
    });

    // Save current signature position
    function saveSigPos(pageNum){
      if(sigImg.style.display !== "none"){
        sigPositions[pageNum] = {
          x: parseInt(sigImg.style.left)||20,
          y: parseInt(sigImg.style.top)||20,
          w: sigImg.clientWidth,
          h: sigImg.clientHeight,
          dataUrl: sigImg.src
        };
      }
    }

    // Navigation
    document.addEventListener("click", e=>{
      if(e.target.id==="prevPage" && currentPage>1){
        saveSigPos(currentPage);
        currentPage--;
        renderPage(currentPage);
      }
      if(e.target.id==="nextPage" && currentPage<totalPages){
        saveSigPos(currentPage);
        currentPage++;
        renderPage(currentPage);
      }
    });

    // Enable Save PDF
    const saveBtn = $("s4Soon");
    saveBtn.disabled = false;
    saveBtn.addEventListener("click", async ()=>{
      if(!$("pdfUpload").files[0]) return alert("Upload a PDF first!");
      saveSigPos(currentPage);

      const buf = await $("pdfUpload").files[0].arrayBuffer();
      const outPdf = await PDFLib.PDFDocument.load(buf);

      for(let p=1; p<=totalPages; p++){
        if(sigPositions[p]){
          const pos = sigPositions[p];
          const pngBytes = await fetch(pos.dataUrl).then(r=>r.arrayBuffer());
          const pngImage = await outPdf.embedPng(pngBytes);
          const page = outPdf.getPage(p-1);

          const pdfW = page.getWidth(), pdfH = page.getHeight();
          const canvasW = pdfCanvas.width, canvasH = pdfCanvas.height;

          const scaleX = pdfW/canvasW, scaleY = pdfH/canvasH;
          const x = pos.x*scaleX;
          const y = (canvasH - pos.y - pos.h)*scaleY;
          const w = pos.w*scaleX, h = pos.h*scaleY;

          page.drawImage(pngImage, { x, y, width:w, height:h });
        }
      }

      const pdfBytes = await outPdf.save();
      const blob = new Blob([pdfBytes], { type:"application/pdf" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "signed.pdf";
      a.click();
    });

    // Init wizard
    go(1);
  </script>
</body>
</html>
